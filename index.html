<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/cauldron.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alchemist's Cauldron</title>
  </head>
  <body>
    <header class="app-header">
      <h1>Alchemist's Cauldron</h1>
      <section id="header-stats" class="header-stats"></section>
    </header>

    <main class="game-container">
      <section id="recipe-panel" class="recipe-panel"></section>

      <section id="shelf" class="shelf" aria-label="Ingredient Shelf"></section>

      <section class="cauldron-area">
        <div id="cauldron" class="cauldron" aria-label="Cauldron Slots"></div>
        <div id="cauldron-counter" class="cauldron-counter"></div>
      </section>

      <div id="feedback-message" class="feedback-message" role="status"></div>

      <section id="controls" class="controls"></section>

      <section
        id="bars"
        class="bars cauldron-bars"
        aria-label="Cauldron Parameters"
      ></section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
